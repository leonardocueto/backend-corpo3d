name: Tests

# Suite de pytest contra un Postgres efimero del runner (nunca contra Neon).
# El superusuario del servicio se usa SOLO en el paso de setup, para crear el rol
# restringido de tests/setup_test_db.sql; los tests corren con ese rol, y
# tests/conftest.py aborta si recibe uno con mas permisos.

on:
  pull_request:
    branches: [qa, dev, main]
  push:
    branches: [qa, dev, main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Misma version mayor que el Dockerfile de produccion.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Create restricted test role
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/setup_test_db.sql

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://corpolab_test:corpolab_test@localhost:5432/corpolab_test
        run: pytest
