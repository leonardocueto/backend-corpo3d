# Blueprint de Render (https://render.com): crea el servicio web del backend a
# partir del Dockerfile. La base de datos NO va aca: se usa Neon (Postgres
# administrado) y su connection string se carga en DATABASE_URL.
#
# Las vars con `sync: false` se cargan A MANO en el dashboard de Render (son
# secretos / dependen de otros servicios). SESSION_SECRET lo genera Render.
services:
  - type: web
    name: backend-corpo3d
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SAMESITE
        # Front (www.corpolab3d.com) y api (api.corpolab3d.com) comparten dominio
        # registrable = same-site: "lax" alcanza (Secure lo fuerza ENVIRONMENT=production).
        value: lax
      - key: SESSION_DAYS
        value: "7"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        # Neon: postgresql+psycopg://USER:PASS@HOST.neon.tech/DB?sslmode=require
        sync: false
      - key: CORS_ORIGINS
        # JSON array con el origen exacto del front: ["https://www.corpolab3d.com"]
        sync: false
      - key: RESET_TOKEN_MINUTES
        value: "10"
      - key: FRONTEND_URL
        # URL del front (base del link del email): https://www.corpolab3d.com
        sync: false
      - key: EMAIL_FROM
        # Remitente. Prueba: "CorpoLab 3D <onboarding@resend.dev>" (solo envia al
        # mail de tu cuenta Resend). Real: no-reply@<dominio verificado>.
        sync: false
      - key: RESEND_API_KEY
        # Secreto de Resend (re_...). Se carga a mano en el dashboard de Render.
        sync: false
      # Login con Google (OIDC). Client ID PUBLICO (no es secreto, pero se carga a
      # mano). El front necesita el MISMO valor en NUXT_PUBLIC_GOOGLE_CLIENT_ID.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Guard de origen: secreto que Cloudflare inyecta como header x-origin-secret
      # (Transform Rule) en api.corpolab3d.com. El backend rechaza (403) todo request
      # que no lo traiga -> cierra el acceso directo a *.onrender.com. Si esta VACIA,
      # el guard queda DESACTIVADO (fail-open). Cargar el MISMO valor de 64 hex que
      # la Transform Rule. Rollout: deployar sin esto -> verificar -> recien cargarla.
      - key: ORIGIN_SECRET
        sync: false
      # Cloudflare R2 (disenos guardados; bucket privado). Secretos: a mano.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false

  # Cron Job: aviso de vencimiento de tiers pagos. Reusa el MISMO Docker image que el
  # web; arranca 1 vez por dia, corre el script y termina. Idempotente (marca
  # expiry_warning_sent_at). "Trigger Run" en el dashboard lo ejecuta on-demand.
  - type: cron
    name: cron-corpo3d-expiry
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    schedule: "0 12 * * *"   # diario 12:00 UTC (~09:00 AR)
    dockerCommand: python -m scripts.notify_expiring
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SESSION_SECRET
        # El script importa app.config (Settings exige SESSION_SECRET aunque el job no
        # use sesiones). Cualquier valor sirve aca; se carga a mano.
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        # Base del link "Renovar mi plan" del email.
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TIER_EXPIRY_WARNING_DAYS
        value: "10"

  # Cron Job: limpieza de export logs viejos (> 6 meses). Borra ExportLog de la
  # DB + los .txt de R2. Los Payment NO se tocan. Idempotente.
  - type: cron
    name: cron-corpo3d-export-cleanup
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    schedule: "30 12 * * *"   # diario 12:30 UTC (30 min offset del expiry cron)
    dockerCommand: python -m scripts.cleanup_export_logs
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
